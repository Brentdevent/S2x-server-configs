//////////////////////////////////////////////////
///         S2x Zombies Server Config          //
//////////////////////////////////////////////////

//////////////////////////////////////////////////
// SERVER NAME & COLORS                         //
//////////////////////////////////////////////////
// ^1 Red       ^2 Green      ^3 Yellow         //
// ^4 Blue      ^5 Cyan       ^6 Pink           //
// ^7 White     ^8 Team color ^9 Orange         //
// ^0 Black                                     //
//////////////////////////////////////////////////

// S2x server identity. Color codes are optional.
set sv_hostname "^1S2x ^2Zombies ^3Dedicated Server"

//////////////////////////////////////////////////
// SERVER CAPACITY & LOBBY                     //
//////////////////////////////////////////////////

// Keep these two limits equal. S2x applies sv_maxplayers to the native
// client limit when the dedicated lobby is initialized. Zombies supports 1-4.
set sv_maxclients "4"
set sv_maxplayers "4"
set sv_minplayers "1"

// Dedicated intermission before the native Zombies prematch/start flow.
set party_matchStartDelay "60"

set sv_lanOnly "0"
set g_consoleLog "s2x/logs/console.log"

//////////////////////////////////////////////////
// ZOMBIES GAME CONFIGURATION                  //
//////////////////////////////////////////////////

// Zombies dedicated servers always use the zombies gametype.
set g_gametype "zombies"
set scr_game_allowkillcam "0"
set scr_game_spectatetype "2"             // 0 disabled, 1 team/player, 2 free spectator
set scr_thirdPerson "0"
set scr_game_perks "1"
set scr_zombies_scorelimit "0"
set scr_zombies_timelimit "0"
set scr_zombies_roundlimit "1"
set scr_zombies_winlimit "1"
set scr_zombies_numlives "1"
set scr_zombies_playerrespawndelay "0"
set scr_zombies_maxagents "24"
set scr_zombies_difficulty "1"

//////////////////////////////////////////////////
// MAP ROTATION                                //
//////////////////////////////////////////////////
// Zombies map fastfiles must be installed in the game directory or zone.
// The rotation parser also checks that every map uses the mp_zombie_ prefix.
//
// Available Zombies maps in the standard install:
// mp_zombie_berlin      mp_zombie_descent   mp_zombie_dig_02
// mp_zombie_dnk         mp_zombie_house     mp_zombie_island
// mp_zombie_nest_01     mp_zombie_training  mp_zombie_windmill

set sv_maprotation "gametype zombies map mp_zombie_nest_01 map mp_zombie_house"
