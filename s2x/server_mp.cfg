//////////////////////////////////////////////////
// MAP ROTATION                                //
//////////////////////////////////////////////////
// Format: gametype <type> map <map_name> ... //
// A gametype remains active until the next gametype token. Replace the
// entries below with maps installed in the game directory.
//
// Standard multiplayer maps:
// mp_aachen_v2             Aachen
// mp_forest_01             Ardennes Forest
// mp_battleship_2          USS Texas
// mp_london                London Docks
// mp_canon_farm            Gustav Cannon
// mp_flak_tower            Flak Tower
// mp_gibraltar_02          Gibraltar
// mp_d_day                 Pointe du Hoc
// mp_france_village        Sainte Marie du Mont
// mp_carentan_s2           Carentan
// mp_carentan_s2_winter    Winter Carentan
// mp_shipment_s2           Shipment 1944
// mp_house                 Groesten Haus
// mp_sandbox_01            Sandbox
// mp_prague                Anthropoid
// mp_wolfslair             Valkyrie
// mp_paris_s2              Occupation
// mp_v2_rocket_02          V2
// mp_egypt_02              Egypt
// mp_dunkirk               Dunkirk
// mp_stalingrad            Stalingrad
// mp_market_garden         Market Garden
// mp_monte_cassino_v2      Monte Cassino
// mp_tank_graveyard_2      Excavation
// mp_airship               Airship
// mp_fuhrerbunker          Chancellery
//
// Special map:
// mp_allieshub_combat_01   Headquarters combat map (dm, gun, or prop)
//
// mp_wolfslair_free is the free-entitlement alias for Valkyrie. Use either
// mp_wolfslair or mp_wolfslair_free
//
// War Mode maps. These maps require gametype raid:
// mp_raid_cobra            Operation Breakout
// mp_raid_d_day            Operation Neptune
// mp_raid_bulge            Operation Griffin
// mp_raid_aachen           Operation Intercept
// mp_raid_dlc2             Operation Husky
// mp_raid_dlc3             Operation Supercharge
// mp_raid_dlc4             Operation Arcane
//
// Dogfight maps. These maps require gametype dogfight:
// mp_egypt_02_dogfight     Egyptian Sands
// mp_mountain_dogfight     Crimean Mountains
//
//
// The rotation parser validates both the map and gametype before loading it.
set sv_maprotation "gametype dom map mp_shipment_s2 map mp_aachen_v2 gametype war map mp_airship"

