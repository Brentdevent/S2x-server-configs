//////////////////////////////////////////////////
///       S2x Multiplayer Server Config        //
//////////////////////////////////////////////////

//////////////////////////////////////////////////
// SERVER NAME & COLORS                         //
//////////////////////////////////////////////////
// ^1 Red       ^2 Green      ^3 Yellow         //
// ^4 Blue      ^5 Cyan       ^6 Pink           //
// ^7 White     ^8 Team color ^9 Orange         //
// ^0 Black                                     //
//////////////////////////////////////////////////

// S2x server identity. Color codes are optional.
set sv_hostname "^1S2x ^2Multiplayer ^3Dedicated Server"

//////////////////////////////////////////////////
// SERVER CAPACITY & LOBBY                     //
//////////////////////////////////////////////////

// Keep these two limits equal. S2x applies party_maxplayers to the native
// client limit when the dedicated lobby is initialized. MP supports 1-18.
set sv_maxclients "18"
set party_maxplayers "18"
set party_minplayers "1"

// Match-start countdown in seconds.
set party_matchStartDelay "60"

// Set to 1 to keep the server off the public list.
set sv_lanOnly "0"

// Enable controller aim assist (0 = disabled, 1 = enabled)
set sv_allowAimAssist "1"

// Console output is written relative to the game directory.
set g_consoleLog "s2x/logs/console.log"

//////////////////////////////////////////////////
// BASE GAME CONFIGURATION                     //
//////////////////////////////////////////////////
// Standard multiplayer gametypes:             //
// dm      Free-for-All                        //
// war     Team Deathmatch                     //
// dom     Domination                          //
// conf    Kill Confirmed                      //
// demo    Demolition                          //
// sd      Search and Destroy                  //
// sr      Search and Rescue                   //
// ctf     Capture the Flag                    //
// hp      Hardpoint                           //
// ball    Gridiron                            //
// twar    Momentum                            //
// gun     Gun Game                            //
// infect  Infected                            //
// prop    Prop Hunt                           //
// undead  Hordepoint                          //
// relic   Relic of the Undead                 //
//
// Map-specific gametypes:                     //
// raid     War Mode; use only mp_raid_* maps  //
// dogfight Dogfight; use only dogfight maps   //
//////////////////////////////////////////////////

// The stock registry also contains frontend, training, and unfinished mode
// names. Those modes are intentionally omitted because they are not suitable
// for a normal dedicated-server rotation.

// Fallback gametype when a rotation entry does not specify one.
set g_gametype "dom"
set g_hardcore "0"

// Common match rules. These names are readable in the S2 dvar dump.
set scr_game_allowkillcam "1"
set scr_game_spectatetype "2"             // 0 disabled, 1 team/player, 2 free spectator
set scr_thirdPerson "0"
set scr_game_perks "1"
set scr_game_hardpoints "1"
set scr_team_fftype "0"
set scr_player_numlives "0"
set scr_player_respawndelay "0"
set scr_player_forcerespawn "1"
set scr_player_maxhealth "100"

//////////////////////////////////////////////////
// GAMETYPE SETTINGS                           //
//////////////////////////////////////////////////
// These are the stock S2 values and can be changed per server. Gametype
// timelimits are in minutes. Bomb, capture, reset, and respawn timers are in
// seconds. A value of 0 usually disables a limit or enables unlimited lives.
// scorelimit: points or objectives required to win the round.
// roundlimit: maximum rounds played; winlimit: rounds required to win.
// numlives: lives per player; playerrespawndelay: individual respawn delay.
// waverespawndelay: team wave respawn delay.

