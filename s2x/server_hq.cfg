//////////////////////////////////////////////////
// S2x Headquarters Server Config               //
//////////////////////////////////////////////////

// Server name shown in the HQ browser. Color codes are optional.
set sv_hostname "S2x Headquarters"

// Set to 1 to keep this HQ off the public list.
// Direct connections remain available.
set sv_lanOnly "0"

// Console output is written relative to the game directory.
set g_consoleLog "s2x/logs/hq-console.log"
